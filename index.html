<!doctype html>
<html lang="en" data-color-theme="medium" style="color-scheme: light">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('nexor:color-theme') || 'medium';
          if (raw === 'cool') raw = 'cold';
          if (raw === 'ink') raw = 'medium';
          var ok = raw === 'frost' || raw === 'light' || raw === 'medium' || raw === 'warm' || raw === 'cold';
          var theme = ok ? raw : 'medium';
          document.documentElement.setAttribute('data-color-theme', theme);
          document.documentElement.style.colorScheme = 'light';
          var path = location.pathname || '';
          if (/\/login\/?$/.test(path)) document.documentElement.classList.add('nexor-login-route');
        } catch (e) {}
      })();
    </script>
    <script id="nexor-randomuuid-polyfill">
      (function () {
        try {
          var c = globalThis.crypto;
          if (!c || typeof c.randomUUID === "function") return;
          c.randomUUID = function () {
            var b = new Uint8Array(16);
            if (c.getRandomValues) c.getRandomValues(b);
            else for (var i = 0; i < 16; i++) b[i] = (Math.random() * 256) | 0;
            b[6] = (b[6] & 15) | 64;
            b[8] = (b[8] & 63) | 128;
            var h = [];
            for (var j = 0; j < 16; j++) h.push((b[j] + 256).toString(16).slice(1));
            return h.slice(0, 4).join("") + "-" + h.slice(4, 6).join("") + "-" + h.slice(6, 8).join("") + "-" + h.slice(8, 10).join("") + "-" + h.slice(10).join("");
          };
        } catch (e) {}
      })();
    </script>
