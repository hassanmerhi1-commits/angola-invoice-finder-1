<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXOR ERP — Updating</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    h1 { font-size: 16px; font-weight: 600; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; max-width: 320px; }
    .bar {
      width: 100%;
      max-width: 300px;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 999px;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    .version { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <h1>Installing update…</h1>
  <p id="msg">Please wait. NEXOR ERP will restart automatically when the installation finishes.</p>
  <div class="bar"><div class="bar-fill"></div></div>
  <div class="version" id="ver"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const v = params.get('version');
    if (v) document.getElementById('ver').textContent = 'Version ' + v;
  </script>
</body>
</html>
