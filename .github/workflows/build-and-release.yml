name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm install --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "npm install failed (attempt $i of 5)"
            Start-Sleep 25
          }
          exit 1

      - name: Install backend dependencies
        shell: pwsh
        working-directory: backend
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm ci --omit=dev --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "backend npm ci failed (attempt $i of 5)"
            Start-Sleep 25
          }
          exit 1

      - name: Install Electron build dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            npm install --save-dev electron electron-builder --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron install failed (attempt $i of 5)"
            Start-Sleep 25
          }
          exit 1

      - name: Build web application
        run: npm run build

      - name: Rebuild native modules for Electron
        run: npm run rebuild:backend

      - name: Stamp desktop shell build
        run: node scripts/write-shell-build.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Stage electron-updater runtime dependencies
        run: node scripts/stage-updater-runtime-deps.cjs

      - name: Build Electron installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($i = 1; $i -le 4; $i++) {
            npx electron-builder --win --publish never --config.win.signAndEditExecutable=false
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder failed (attempt $i of 4)"
            if (Test-Path release) { Remove-Item -Recurse -Force release }
            Start-Sleep 30
          }
          exit 1

      - name: Build city-server update pack
        run: |
          npm run build:webapp
          node scripts/pack-server-update.mjs
          node scripts/write-latest-desktop.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify release artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path release -ErrorAction Stop | Format-Table Name, Length
          if (-not (Test-Path release/latest.yml)) {
            Write-Error "latest.yml missing — auto-update will not work"
          }
          $appUpdate = Get-ChildItem -Path release/win-unpacked/resources/app-update.yml -ErrorAction SilentlyContinue
          if (-not $appUpdate) {
            Write-Error "app-update.yml missing from packaged resources"
          } else {
            $yml = Get-Content $appUpdate.FullName -Raw
            if ($yml -notmatch 'repo:\s*angola-invoice-finder-1') {
              Write-Error "app-update.yml has wrong repo — expected angola-invoice-finder-1"
            }
            Write-Host "OK: app-update.yml repo verified"
          }
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe found in release/"
          }
          Write-Host "OK: $($exe.Name) + latest.yml"
          if (-not (Test-Path release/nexor-server-update.zip)) {
            Write-Error "nexor-server-update.zip missing — city servers cannot use Actualizar NEXOR"
          }
          if (-not (Test-Path release/latest-server.json)) {
            Write-Error "latest-server.json missing — city servers cannot check for a pack"
          }
          if (-not (Test-Path release/latest-desktop.json)) {
            Write-Error "latest-desktop.json missing — tills cannot take the desktop shell from the city"
          }
          node scripts/verify-packaged-updater.mjs

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXOR ERP ${{ github.ref_name }}
          files: |
            release/*.exe
            release/latest.yml
            release/nexor-server-update.zip
            release/latest-server.json
            release/latest-desktop.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
