services:
  postgres:
    image: postgres:16
    container_name: kwanza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kwanza_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yel3an7azi}
    ports:
      - "5432:5432"
    volumes:
      - kwanza_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kwanza_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NEXOR ERP backend API (the thing LAN/Tailscale clients connect to on :3000).
  # Runs headless — no desktop app required. Applies migrations on startup.
  backend:
    build: ./backend
    container_name: nexor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-yel3an7azi}@postgres:5432/kwanza_erp
      PORT: 3000
      NODE_ENV: production
      BACKUP_DIR: /app/backups
      # Daily pg_dump into nexor_backups volume (requires postgresql-client-16 in image).
      AUTO_BACKUP: "1"
      AUTO_BACKUP_INTERVAL_HOURS: "24"
      AUTO_BACKUP_KEEP: "14"
      # Shown in /api/health appVersion — bump on release so deploys are verifiable.
      NEXOR_APP_VERSION: 1.1.49
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload source from the host so repair/verify scripts stay current without rebuild.
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      # Writable import drop folder (scripts may copy erp.db here). Prefer docker cp to /tmp.
      - ./import:/import
      - nexor_backups:/app/backups

volumes:
  kwanza_pgdata:
    driver: local
  nexor_backups:
    driver: local
