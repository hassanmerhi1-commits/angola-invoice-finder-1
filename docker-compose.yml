services:
  postgres:
    image: postgres:16
    container_name: kwanza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kwanza_erp
      POSTGRES_USER: postgres
      # SECURITY: override in .env — do not leave the compose default on internet-facing hosts.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yel3an7azi}
    ports:
      # Prefer binding to localhost only on exposed servers: "127.0.0.1:5432:5432"
      - "5432:5432"
    volumes:
      - kwanza_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kwanza_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NEXOR ERP backend API (the thing LAN/Tailscale clients connect to on :3000).
  # Runs headless — no desktop app required. Applies migrations on startup.
  backend:
    build: ./backend
    container_name: nexor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-yel3an7azi}@postgres:5432/kwanza_erp
      PORT: 3000
      NODE_ENV: production
      BACKUP_DIR: /app/backups
      # Daily pg_dump into nexor_backups volume (requires postgresql-client-16 in image).
      AUTO_BACKUP: "1"
      AUTO_BACKUP_INTERVAL_HOURS: "24"
      AUTO_BACKUP_KEEP: "14"
      # Optional offsite copy — mount a host folder and uncomment:
      # BACKUP_OFFSITE_DIR: /app/backups-offsite
      # Shown in /api/health appVersion — bump on release so deploys are verifiable.
      NEXOR_APP_VERSION: 1.1.92
      # Persist across container recreates — set JWT_SECRET in .env or every redeploy
      # invalidates all shop sessions ("Invalid or expired token").
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # Shop-client outbox (/api/sync/client-ingest). Without a shared key, allow
      # ingest on trusted LAN/Tailscale. For stricter setups, remove this and set
      # the same NEXOR_CLIENT_SYNC_API_KEY on server + each shop's sync.env.
      NEXOR_ALLOW_OPEN_CLIENT_INGEST: "1"
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload source from the host so repair/verify scripts stay current without rebuild.
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      # Built Vite UI (npm run build:webapp → backend/webapp). Required for browser /app.
      - ./backend/webapp:/app/webapp
      # Writable import drop folder (scripts may copy erp.db here). Prefer docker cp to /tmp.
      - ./import:/import
      - nexor_backups:/app/backups

volumes:
  kwanza_pgdata:
    driver: local
  nexor_backups:
    driver: local
