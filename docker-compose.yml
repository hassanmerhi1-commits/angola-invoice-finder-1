services:
  postgres:
    image: postgres:16
    container_name: kwanza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kwanza_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yel3an7azi}
    ports:
      - "5432:5432"
    volumes:
      - kwanza_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kwanza_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NEXOR ERP backend API (the thing LAN/Tailscale clients connect to on :3000).
  # Runs headless — no desktop app required. Applies migrations on startup.
  backend:
    build: ./backend
    container_name: nexor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-yel3an7azi}@postgres:5432/kwanza_erp
      PORT: 3000
      NODE_ENV: production
      BACKUP_DIR: /app/backups
    ports:
      - "3000:3000"
    volumes:
      # Drop belas.db here to run the one-time SQLite -> Postgres migration.
      - ./import:/import:ro
      - nexor_backups:/app/backups

volumes:
  kwanza_pgdata:
    driver: local
  nexor_backups:
    driver: local
